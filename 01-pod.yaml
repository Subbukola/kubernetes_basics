apiVersion: v1 
kind: Pod
metadata:
    
    name: robo-pod
    namespace: practice
    labels:
      env: dev
      
spec:
  containers:
    - name: nginx
      image: nginx
      ports:
        - containerPort: 80

    - name: redis
      image: redis
      ports:
        - containerPort: 6379
    
---
