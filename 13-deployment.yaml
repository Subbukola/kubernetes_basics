apiVersion: apps/v1
kind: Deployment
metadata:
  name: roboshop-deployment
  labels:
    project: roboshop
    env: dev
spec:
  replicas: 3
  selector:
    matchLabels:
      project: roboshop
      env: dev
  template:
    metadata:
      name: robo-dep-pod
      labels:
        project: roboshop
        env: dev

    spec:
      containers:
        - name: nginx
          image: nginx
          ports:
            - containerPort: 80

---
apiVersion: v1 
kind: Service
metadata:
  name: deployment-secret
  labels:
    project: roboshop
    env: dev
spec:
  type: NodePort
  selector:
    project: roboshop
    env: dev
  ports:
    - port: 80
      containerPort: 80
      protocol: TCP
